# Автоматическое обновление сервера после push в main (если менялись база или функции/бот):
# применяет новые миграции и заново выкладывает Edge Functions. Секреты бота и вебхук не трогает,
# демо-данные не загружает. Кнопку «Supabase: установить сервер» после обычных изменений нажимать не нужно.
# Можно запустить вручную: Actions → «Supabase: обновить базу и функции» → Run workflow
# (например, после добавления секрета PHOTO_TRIGGER_TOKEN).
name: "Supabase: обновить базу и функции"

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-migrate
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: sxxonmdivzayvzmyhjzy

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PHOTO_TRIGGER_TOKEN: ${{ secrets.PHOTO_TRIGGER_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Проверка секретов
        run: |
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Не задан секрет $v"; exit 1; fi
          done

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Подключение к проекту
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Новые миграции
        run: supabase migration list --password "$SUPABASE_DB_PASSWORD" || true

      - name: Применение
        run: supabase db push --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Мгновенный запуск обработки фото (если задан секрет PHOTO_TRIGGER_TOKEN)
        if: ${{ !cancelled() }}
        run: |
          if [ -n "$PHOTO_TRIGGER_TOKEN" ]; then
            supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" PHOTO_TRIGGER_TOKEN="$PHOTO_TRIGGER_TOKEN" PHOTO_TRIGGER_REPO="${{ github.repository }}"
            echo "Фото будут обрабатываться сразу после импорта"
          else
            echo "::notice::Секрет PHOTO_TRIGGER_TOKEN не задан — фото обрабатываются по расписанию GitHub (бывает с задержкой в часы)"
          fi

      - name: Выкладка Edge Functions
        if: ${{ !cancelled() }}
        run: |
          for f in auth-telegram create-order order-action payment-create payment-webhook payment-refund telegram-bot photo-kick; do
            supabase functions deploy "$f" --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --import-map supabase/functions/import_map.json
          done
