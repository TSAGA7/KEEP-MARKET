# Применяет новые миграции БД после push в main (только если менялась папка supabase/migrations).
# Ничего больше не трогает: секреты, Edge Functions и бот остаются как есть, демо-данные не загружаются.
# Можно запустить вручную: Actions → «Supabase: применить миграции» → Run workflow.
name: "Supabase: применить миграции"

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-migrate
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: sxxonmdivzayvzmyhjzy

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Проверка секретов
        run: |
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Не задан секрет $v"; exit 1; fi
          done

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Подключение к проекту
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Новые миграции
        run: supabase migration list --password "$SUPABASE_DB_PASSWORD" || true

      - name: Применение
        run: supabase db push --password "$SUPABASE_DB_PASSWORD" --yes
