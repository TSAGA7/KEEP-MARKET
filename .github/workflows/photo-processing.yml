# Удаление фона у новых фото товаров (импорт из Telegram, кнопка «Обработать заново» в админке).
# Работает по расписанию; если очередь пуста — завершается за ~20 секунд.
name: "Фото: удаление фона"

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: photo-processing
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: sxxonmdivzayvzmyhjzy

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Ключ доступа к базе
        id: key
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::Нет секрета SUPABASE_ACCESS_TOKEN"; exit 1; fi
          keys=$(supabase projects api-keys --project-ref "$SUPABASE_PROJECT_REF" -o json --reveal 2>/dev/null || supabase projects api-keys --project-ref "$SUPABASE_PROJECT_REF" -o json)
          key=$(echo "$keys" | python3 -c "import sys,json; ks=json.load(sys.stdin); print(next(k['api_key'] for k in ks if k.get('name')=='service_role'))")
          echo "::add-mask::$key"
          echo "SUPABASE_SERVICE_ROLE_KEY=$key" >> "$GITHUB_ENV"
          echo "SUPABASE_URL=https://${SUPABASE_PROJECT_REF}.supabase.co" >> "$GITHUB_ENV"

      - name: Есть ли фото в очереди
        id: queue
        run: |
          n=$(curl -fsS "$SUPABASE_URL/rest/v1/product_images?select=id&processing_status=in.(pending,processing)&limit=1" \
                -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" | python3 -c "import sys,json; print(len(json.load(sys.stdin)))")
          echo "pending=$n" >> "$GITHUB_OUTPUT"
          echo "В очереди: $n"

      - uses: actions/setup-python@v5
        if: steps.queue.outputs.pending != '0'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements-photos.txt

      - name: Модели нейросетей (кэш)
        if: steps.queue.outputs.pending != '0'
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: rembg-models-v1

      - name: Обработка
        if: steps.queue.outputs.pending != '0'
        env:
          U2NET_HOME: /home/runner/.u2net
        run: |
          pip install -r scripts/requirements-photos.txt
          python scripts/process_photos.py
