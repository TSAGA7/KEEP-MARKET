# Кнопка «Установить / обновить сервер»: Actions → «Supabase: установить сервер» → Run workflow.
# Применяет миграции БД, задаёт секреты Edge Functions, деплоит функции и настраивает Telegram-бота.
# Запускается ТОЛЬКО вручную. Все секреты берутся из Settings → Secrets and variables → Actions → Secrets.
name: "Supabase: установить сервер"

on:
  workflow_dispatch:
    inputs:
      demo_data:
        description: "Загрузить демо-товары (только для проверки, не для боевого запуска)"
        type: boolean
        default: true
      app_short_name:
        description: "Short name Mini App из @BotFather (/newapp). Можно оставить пустым"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: supabase-setup
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: sxxonmdivzayvzmyhjzy

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      APP_JWT_SECRET: ${{ secrets.APP_JWT_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Проверка секретов
        run: |
          missing=""
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD APP_JWT_SECRET TELEGRAM_BOT_TOKEN; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Не заданы секреты:$missing. Добавьте их в Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          if [ ${#APP_JWT_SECRET} -lt 32 ]; then echo "::error::APP_JWT_SECRET короче 32 символов — скопируйте Legacy JWT Secret целиком"; exit 1; fi
          echo "Секреты на месте"

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Узнать имя бота
        id: bot
        run: |
          resp=$(curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe") || { echo "::error::Telegram не принял токен бота — проверьте TELEGRAM_BOT_TOKEN"; exit 1; }
          username=$(echo "$resp" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);if(!j.ok)process.exit(1);console.log(j.result.username)})")
          echo "username=$username" >> "$GITHUB_OUTPUT"
          echo "Бот: @$username"

      - name: Подключение к проекту
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Миграции базы данных
        run: |
          if [ "${{ inputs.demo_data }}" = "true" ]; then
            supabase db push --password "$SUPABASE_DB_PASSWORD" --include-seed --yes
          else
            supabase db push --password "$SUPABASE_DB_PASSWORD" --yes
          fi

      - name: Секреты Edge Functions
        id: secrets
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          APP_URL="https://${OWNER,,}.github.io/${REPO}/"
          WEBHOOK_SECRET=$(openssl rand -hex 32)
          echo "::add-mask::$WEBHOOK_SECRET"
          echo "webhook_secret=$WEBHOOK_SECRET" >> "$GITHUB_OUTPUT"
          echo "app_url=$APP_URL" >> "$GITHUB_OUTPUT"
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" \
            APP_ENV=production \
            APP_PUBLIC_URL="${APP_URL%/}" \
            APP_ORIGINS="https://${OWNER,,}.github.io" \
            APP_JWT_SECRET="$APP_JWT_SECRET" \
            TELEGRAM_BOT_TOKEN="$TELEGRAM_BOT_TOKEN" \
            TELEGRAM_BOT_USERNAME="${{ steps.bot.outputs.username }}" \
            TELEGRAM_APP_SHORT_NAME="${{ inputs.app_short_name }}" \
            TELEGRAM_WEBHOOK_SECRET="$WEBHOOK_SECRET" \
            INIT_DATA_MAX_AGE_SECONDS=86400 \
            SESSION_TTL_SECONDS=43200 \
            PAYMENT_PROVIDER=none

      - name: Деплой Edge Functions
        run: |
          for f in auth-telegram create-order order-action payment-create payment-webhook payment-refund telegram-bot; do
            supabase functions deploy "$f" --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --import-map supabase/functions/import_map.json
          done

      - name: Настройка Telegram-бота
        env:
          TELEGRAM_WEBHOOK_SECRET: ${{ steps.secrets.outputs.webhook_secret }}
          SUPABASE_URL: https://${{ env.SUPABASE_PROJECT_REF }}.supabase.co
          APP_PUBLIC_URL: ${{ steps.secrets.outputs.app_url }}
        run: node scripts/telegram-setup.mjs

      - name: Проверка входа (JWT)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/auth-telegram" \
            -H "Content-Type: application/json" -d '{"initData":"auth_date=1&hash=00"}')
          echo "auth-telegram ответил: $code (ожидается 401 на поддельные данные)"
          if [ "$code" != "401" ]; then echo "::warning::Функция входа отвечает неожиданно ($code) — проверьте логи в Supabase → Edge Functions"; fi

      - name: Итог
        run: |
          {
            echo "## Сервер установлен"
            echo "- Бот: @${{ steps.bot.outputs.username }}"
            echo "- Магазин: ${{ steps.secrets.outputs.app_url }}"
            echo "- Демо-товары: ${{ inputs.demo_data }}"
            echo ""
            echo "Дальше: откройте бота в Telegram → кнопка «Магазин»."
          } >> "$GITHUB_STEP_SUMMARY"
