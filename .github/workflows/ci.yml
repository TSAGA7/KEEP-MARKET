# Проверки для pull request: типы, тесты (включая SQL/RLS на встроенном Postgres), Deno-проверка Edge Functions.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Deno check Edge Functions
        working-directory: supabase/functions
        run: for f in */index.ts; do deno check --import-map=import_map.json "$f"; done
